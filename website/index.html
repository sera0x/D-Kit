<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050606" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>D-Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>html { background-color: #050606; }</style>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<pre style="color:#fff;padding:2rem;white-space:pre-wrap;font-family:monospace;font-size:14px;">JS ERROR:\n' + (e.error && e.error.stack ? e.error.stack : e.message) + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<pre style="color:#fff;padding:2rem;white-space:pre-wrap;font-family:monospace;font-size:14px;">UNHANDLED PROMISE REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.message) + '</pre>';
      });
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
